name: Harness

# 화면 요청 이슈를 이 Mac(self-hosted runner, 라벨 ooee-mac)에서 **손으로** 돌리는 자리다. Claude 와 gh 가
# 이 Mac 에 로그인한 계정으로 돈다 — GitHub 이 빌려 주는 컴퓨터에는 그 로그인이 없다.
#
# **저절로 도는 길은 이 파일이 아니다**(개발자 결정 `2026-09-23`) — 새 요청과 결정은 이 Mac 의 1분 감시
# (scripts/harness/watch-decisions.mjs, launchd)가 job 밖에서 돌린다. 까닭은 scripts/harness/README.md 「러너」.
#
# 그래서 여기 남는 것은 `workflow_dispatch` 하나다. Actions 화면에서 손으로 부를 때, 또는 이 Mac 의 감시가
# 멈췄을 때 쓴다. 감시가 이미 돌린 것을 또 돌리지 않게, 부르기 전에 `~/.ooee-harness/runs/` 를 본다.
#
# 이 길은 actions runner 서비스(`~/actions-runner`, launchd `actions.runner.…ooee-mac`)가 켜져 있고 그 `_work`
# 사본에서 `claude` 를 한 번 열어 신뢰를 수락해야 돈다. job 이 도는 동안은 watch-tick.sh 의 pgrep 이 감시를
# 멈추므로 둘이 겹치지 않는다. Actions 화면의 「Use workflow from」을 dev 로 골라야 dev 의 이 파일로 돈다
# (기본은 main).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 처리 · 결정 · 결과
        type: choice
        options: [처리, 결정, 결과]
        default: 처리
      issue:
        description: 이슈 번호 (결정은 비우면 열린 화면 요청 전부)
        required: false

permissions:
  contents: read

jobs:
  process:
    name: 화면 요청 처리
    if: inputs.mode != '결정'
    runs-on: [self-hosted, ooee-mac]
    # 여러 장 요청은 화면마다 코드와 검사를 돌려 오래 걸린다.
    timeout-minutes: 240
    steps:
      - name: dev 를 받는다
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          # GITHUB_TOKEN 으로 push·머지하면 Quality·Deploy 가 깨지 않는다. 이 Mac 의 gh 로그인을 쓴다.
          persist-credentials: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 처리한다
        run: node scripts/harness/runner.mjs "$MODE" "$ISSUE"
        env:
          MODE: ${{ inputs.mode }}
          ISSUE: ${{ inputs.issue }}

  decide:
    name: 결정 확인
    if: inputs.mode == '결정'
    runs-on: [self-hosted, ooee-mac]
    timeout-minutes: 240
    steps:
      - name: dev 를 받는다
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 결정이 없으면 Claude 를 부르지 않고 끝난다. 판독은 gh 읽기뿐이다.
      - name: 결정을 읽고 처리한다
        run: node scripts/harness/runner.mjs 결정 $ISSUE
        env:
          ISSUE: ${{ inputs.issue }}
